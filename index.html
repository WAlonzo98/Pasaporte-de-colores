<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pasaporte de Colores</title>
<style>
:root {
  --navy:#17155f;
  --sky:#68c6ef;
  --grass:#9fd52a;
  --green:#46aa38;
  --yellow:#ffbe22;
  --orange:#ff9d10;
  --pink:#ff5570;
  --cream:#fff8ea;
  --white:#ffffff;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;background:#edfaff;color:var(--navy)}
body{display:flex;align-items:center;justify-content:center;padding:18px}
button{font:inherit}
.game-shell{
 width:min(100%,980px); min-height:650px; background:linear-gradient(#66c8ef 0 58%,#a4d92e 58% 100%);
 border-radius:34px; overflow:hidden; position:relative; box-shadow:0 22px 60px rgba(20,25,60,.2);
 border:6px solid #fff;
}
.cloud{position:absolute;background:#fff;border-radius:999px;opacity:.92}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud.c1{width:150px;height:50px;left:-35px;top:72px}
.cloud.c1:before{width:70px;height:70px;left:30px;bottom:0}
.cloud.c1:after{width:55px;height:55px;left:78px;bottom:0}
.cloud.c2{width:170px;height:52px;right:-45px;top:66px}
.cloud.c2:before{width:76px;height:76px;right:26px;bottom:0}
.cloud.c2:after{width:58px;height:58px;right:90px;bottom:0}
.bush{position:absolute;bottom:0;width:220px;height:170px;background:#2e9f57;border-radius:55% 55% 0 0;opacity:.7}
.bush.left{left:-70px} .bush.right{right:-70px}
.screen{position:relative;z-index:2;min-height:650px;padding:28px;display:none}
.screen.active{display:flex;flex-direction:column}
.logo{width:min(360px,70vw);max-height:150px;object-fit:contain;margin:0 auto 10px}
.start{align-items:center;justify-content:center;text-align:center}
.start-card{width:min(650px,94%);background:rgba(255,255,255,.92);border-radius:30px;padding:32px 28px;box-shadow:0 12px 30px rgba(16,36,70,.12)}
.start-qr{height:160px;object-fit:contain;margin:2px auto 8px}
.start h1{font-size:clamp(30px,5vw,55px);margin:4px 0 8px}
.start p{font-size:clamp(17px,2.3vw,22px);margin:0 auto 22px;max-width:540px;line-height:1.35}
.primary{border:0;border-radius:999px;background:var(--yellow);color:var(--navy);font-weight:900;padding:16px 30px;font-size:20px;cursor:pointer;box-shadow:0 7px 0 #df8b05;transition:.15s}
.primary:hover{transform:translateY(-2px)} .primary:active{transform:translateY(4px);box-shadow:0 3px 0 #df8b05}
.topbar{display:grid;grid-template-columns:220px 1fr 220px;align-items:center;gap:10px;margin-bottom:14px}
.topbar .logo{width:220px;margin:0}
.progress{display:flex;justify-content:center;align-items:center;gap:0}
.step{width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:#aaa;color:#fff;border:5px solid #fff;font-size:25px;font-weight:900;position:relative;z-index:2}
.step.done{background:#50b72e} .step.current{background:var(--yellow)}
.bar{width:100px;height:13px;background:#bfc4c8;margin:0 -2px}
.bar.done{background:var(--yellow)}
.score{text-align:right;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.08)}
.question-box{width:min(820px,96%);margin:4px auto 18px;background:var(--cream);border-radius:28px;padding:20px 28px;text-align:center;font-size:clamp(25px,4vw,42px);font-weight:900;line-height:1.1;box-shadow:0 8px 0 rgba(255,255,255,.38)}
.options{width:min(860px,98%);margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.option{border:0;background:#fff;border-radius:28px;min-height:270px;padding:18px;cursor:pointer;box-shadow:0 9px 0 rgba(56,123,25,.24);transition:.16s;position:relative}
.option:hover{transform:translateY(-5px);box-shadow:0 14px 0 rgba(56,123,25,.2)}
.option img{width:100%;height:205px;object-fit:contain}
.option .label{font-size:20px;font-weight:900;color:var(--navy)}
.option.correct{outline:8px solid #49aa3d;background:#f3ffd9}
.option.wrong{outline:8px solid #ff647b;animation:shake .25s 2}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.feedback{margin:18px auto 0;background:#fff;border-radius:999px;padding:12px 20px;font-weight:900;min-width:230px;text-align:center;opacity:0;transform:translateY(8px);transition:.2s}
.feedback.show{opacity:1;transform:none}
.upgrade{align-items:center;justify-content:center;text-align:center}
.upgrade-card{width:min(700px,94%);background:rgba(255,255,255,.93);padding:26px;border-radius:32px}
.hero-img{height:285px;max-width:90%;object-fit:contain}
.upgrade h2{font-size:clamp(31px,5vw,52px);margin:8px 0 4px}
.upgrade p{font-size:21px;margin:0 0 18px}
.stars{font-size:40px;letter-spacing:10px;color:var(--yellow);margin-bottom:8px}
.reward{align-items:center;justify-content:center;text-align:center}
.reward-card{width:min(720px,94%);background:rgba(255,255,255,.94);padding:26px;border-radius:34px}
.medal-img{height:330px;max-width:92%;object-fit:contain}
.reward h2{font-size:clamp(34px,5vw,56px);margin:8px 0 4px}
.reward p{font-size:20px;margin:6px 0 20px}
.small-btn{border:0;border-radius:999px;background:var(--navy);color:#fff;font-weight:900;padding:13px 22px;cursor:pointer}
@media(max-width:760px){
 body{padding:0} .game-shell{border-radius:0;border:0;min-height:100vh} .screen{min-height:100vh;padding:20px 14px}
 .topbar{grid-template-columns:1fr;gap:8px} .topbar .logo{width:190px;margin:auto} .score{text-align:center}
 .options{grid-template-columns:1fr;max-width:420px} .option{min-height:160px;display:grid;grid-template-columns:150px 1fr;align-items:center}
 .option img{height:140px} .question-box{font-size:28px} .bar{width:60px}
}
</style>
</head>

const questions=[
 {
  text:"¿Cuál de estos alimentos es una verdura?",
  choices:[
   {name:"Tomate",img:IMAGES.tomato,ok:false},
   {name:"Brócoli",img:IMAGES.broccoli,ok:true},
   {name:"Banano",img:IMAGES.banana,ok:false}
  ]
 },
 {
  text:"¿Cuál de estos alimentos es de color naranja?",
  choices:[
   {name:"Uvas",img:IMAGES.grapes,ok:false},
   {name:"Zanahoria",img:IMAGES.carrot,ok:true},
   {name:"Brócoli",img:IMAGES.broccoli,ok:false}
  ]
 },
 {
  text:"¿Cuál de estas opciones es un hábito saludable?",
  choices:[
   {name:"Comer frutas y verduras",img:IMAGES.tomato,ok:true},
   {name:"Comer solo dulces",img:IMAGES.grapes,ok:false},
   {name:"No tomar agua",img:IMAGES.banana,ok:false}
  ]
 }
];

let index=0,correct=0,locked=false;

function show(id){
 document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
 document.getElementById(id).classList.add("active");
}
function startGame(){index=0;correct=0;locked=false;show("quiz");render();}
function renderProgress(){
 let html="";
 for(let i=0;i<3;i++){
   const cls=i<index?"done":i===index?"current":"";
   html+=`<div class="step ${cls}">${i+1}</div>`;
   if(i<2) html+=`<div class="bar ${i<index?"done":""}"></div>`;
 }
 document.getElementById("progress").innerHTML=html;
 document.getElementById("score").textContent=`${correct} / 3 correctas`;
}
function render(){
 locked=false; renderProgress();
 const q=questions[index];
 document.getElementById("question").textContent=q.text;
 const wrap=document.getElementById("options"); wrap.innerHTML="";
 const fb=document.getElementById("feedback"); fb.className="feedback"; fb.textContent="";
 q.choices.forEach(c=>{
  const b=document.createElement("button"); b.className="option";
  b.innerHTML=`<img src="${c.img}" alt="${c.name}"><div class="label">${c.name}</div>`;
  b.onclick=()=>answer(b,c.ok); wrap.appendChild(b);
 });
}
function answer(btn,ok){
 if(locked)return;
 const fb=document.getElementById("feedback");
 if(!ok){
   btn.classList.add("wrong");
   fb.textContent="¡Casi! Intenta otra vez";
   fb.className="feedback show";
   setTimeout(()=>btn.classList.remove("wrong"),550);
   return;
 }
 locked=true; btn.classList.add("correct"); correct++;
 document.getElementById("score").textContent=`${correct} / 3 correctas`;
 fb.textContent="¡Muy bien! Respuesta correcta";
 fb.className="feedback show";
 setTimeout(()=>showUpgrade(),700);
}
function showUpgrade(){
 document.getElementById("stars").textContent="★".repeat(correct);
 document.getElementById("upgradeTitle").textContent=correct===3?"¡Avatar al máximo!":"¡Tu avatar mejoró!";
 document.getElementById("upgradeText").textContent=correct===1?"Desbloqueaste tu primera mejora.":correct===2?"Tu héroe se vuelve más fuerte.":"Completaste las 3 mejoras.";
 document.getElementById("continueBtn").textContent=correct===3?"Ver recompensa":"Siguiente pregunta";
 show("upgrade");
}
function continueGame(){
 if(index===questions.length-1){show("reward");}
 else{index++;show("quiz");render();}
